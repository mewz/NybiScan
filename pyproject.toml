[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nybiscan"
version = "0.1.0"
description = "NybiScan core: project-based HTTP/HTTPS intercepting proxy for authorized penetration testing."
requires-python = ">=3.11"
dependencies = [
    # pydantic capped <2.12: mitmproxy 12.2.3 pins typing-extensions<=4.14, while
    # pydantic>=2.12 requires typing-extensions>=4.14.1. Capping keeps the whole
    # dependency set resolvable to prebuilt wheels (no source builds).
    "pydantic>=2,<2.12",
    "fastapi",
    "uvicorn[standard]",
    "sqlcipher3==0.6.2",
    "argon2-cffi",
    "tomli-w",
    "mitmproxy==12.2.3",
    # Spider link/form extraction (Plan 5). Robust parsing of malformed real-world
    # HTML matters: a missed link is a missed endpoint.
    "beautifulsoup4",
]

[project.optional-dependencies]
# httpx2 (Pydantic-maintained successor to httpx, github.com/pydantic/httpx2) is
# what starlette.testclient now uses; installing it avoids the deprecated httpx
# fallback path. We only touch an http client via TestClient.
dev = ["pytest", "httpx2"]
# The MCP server (Plan 6) is an OPT-IN extra so the core install is unburdened. It
# resolves cleanly against the pydantic<2.12 / mitmproxy pins. Only nybiscan.mcp.server
# imports it; the MCP tool logic + /agent/fetch are tested without the SDK.
mcp = ["mcp"]

[project.scripts]
nybiscan = "nybiscan.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Silence third-party deprecation noise (mitmproxy/pyparsing/ldap3/starlette).
# We have no deprecations of our own to surface yet.
filterwarnings = [
    "ignore::DeprecationWarning",
]
